name: CI
'on':
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install lsof
        run: command -v lsof || (sudo apt-get update && sudo apt-get install -y lsof)
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Test everything
        run: pnpm test
      - name: Build
        run: pnpm build
  report-result:
    name: Open or close the main CI issue
    needs:
      - check
    if: always() && github.event_name == 'push'
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/report-failure.yml
