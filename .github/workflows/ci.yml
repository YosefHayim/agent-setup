name: CI
'on':
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      since: ${{ steps.filter.outputs.everything != 'true' && github.event.pull_request.base.sha || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          token: ''
          filters: |
            everything:
              - pnpm-lock.yaml
              - pnpm-workspace.yaml
              - package.json
              - biome.json
              - 'tsconfig*.json'
              - '*.config.ts'
              - vitest.setup.ts
              - '.github/**'
              - '.husky/**'
  report-failure:
    name: Open issue on main failure
    needs:
    - biome
    - typecheck
    - style
    - test
    - build
    - readme
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
      actions: read
    uses: ./.github/workflows/report-failure.yml
  biome:
    needs: changes
    uses: ./.github/workflows/biome.yml
    with:
      since: ${{ needs.changes.outputs.since }}
  typecheck:
    uses: ./.github/workflows/typecheck.yml
  style:
    uses: ./.github/workflows/style.yml
  test:
    needs: changes
    uses: ./.github/workflows/test.yml
    with:
      since: ${{ needs.changes.outputs.since }}
  build:
    uses: ./.github/workflows/build.yml
  readme:
    uses: ./.github/workflows/readme.yml
  gate:
    name: CI Gate
    runs-on: ubuntu-slim
    timeout-minutes: 5
    needs:
    - changes
    - biome
    - typecheck
    - style
    - test
    - build
    - readme
    if: always()
    steps:
    - name: Require every check to pass
      run: test "${{ needs.changes.result }}" = "success" && test "${{ needs.biome.result }}" = "success" && test "${{ needs.typecheck.result }}" = "success" && test "${{ needs.style.result
        }}" = "success" && test "${{ needs.test.result }}" = "success" && test "${{ needs.build.result }}" = "success" &&
        test "${{ needs.readme.result }}" = "success"
