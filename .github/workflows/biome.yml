name: Biome
'on':
  workflow_call:
    inputs:
      since:
        description: Base commit to check changes against. Empty checks everything.
        type: string
        default: ''
permissions:
  contents: read
jobs:
  biome:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Run check
        if: inputs.since == ''
        run: pnpm exec biome ci .
      - name: Run check on changed files
        if: inputs.since != ''
        env:
          SINCE: ${{ inputs.since }}
        run: pnpm exec biome ci --changed --since="$SINCE" --no-errors-on-unmatched
