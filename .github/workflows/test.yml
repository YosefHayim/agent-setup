name: Test
'on':
  workflow_call:
    inputs:
      since:
        description: Base commit to test changes against. Empty runs every test.
        type: string
        default: ''
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install lsof
        run: command -v lsof || (sudo apt-get update && sudo apt-get install -y lsof)
      - name: Setup workspace
        uses: ./.github/actions/setup
      - name: Run check
        if: inputs.since == ''
        run: pnpm test
      - name: Run check on changed files
        if: inputs.since != ''
        env:
          SINCE: ${{ inputs.since }}
        run: pnpm exec vitest run --changed "$SINCE"
